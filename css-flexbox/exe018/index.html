<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="weather">
            <div class="weather__period">Manhã</div>
            <div class="weather__icon"><img src="nublado.png" alt="nublado"></div>
            <div class="weather__minmax">
                <span class="weather__min">20&ordm;</span>
                <span class="weather__max">25&ordm;</span>
            </div>
            <div class="weather__hr">HR 85%</div>
        </div>
        <div class="weather">
            <div class="weather__period">Tarde</div>
            <div class="weather__icon"><img src="parcilmente_nublado.png" alt="nublado"></div>
            <div class="weather__minmax">
                <span class="weather__min">25&ordm;</span>
                <span class="weather__max">30&ordm;</span>
            </div>
            <div class="weather__hr">HR 50%</div>
        </div>
        <div class="weather">
            <div class="weather__period">Noite</div>
            <div class="weather__icon"><img src="trovoada.png" alt="nublado"></div>
            <div class="weather__minmax">
                <span class="weather__min">18&ordm;</span>
                <span class="weather__max">23&ordm;</span>
            </div>
            <div class="weather__hr">HR 65%</div>
        </div>
        <div class="weather">
            <div class="weather__period">Madrugada</div>
            <div class="weather__icon"><img src="lua.png" alt="nublado"></div>
            <div class="weather__minmax">
                <span class="weather__min">17&ordm;</span>
                <span class="weather__max">20&ordm;</span>
            </div>
            <div class="weather__hr">HR 65%</div>
        </div>
    </div>
</body>
</html>
